name: Update Tailscale Version

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: update-tailscale
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest Tailscale stable version
        id: versions
        run: |
          LATEST=$(
            curl -fsSL --retry 3 https://pkgs.tailscale.com/stable/ \
              | grep -oP 'tailscale_\K\d+\.\d+\.\d+(?=_amd64\.tgz)' \
              | sort -V \
              | tail -1
          ) || true
          if [ -z "$LATEST" ]; then
            echo "Failed to fetch latest Tailscale version" >&2
            exit 1
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest version: $LATEST"

      - name: Get current version
        id: current
        run: |
          VERSION=$(jq -r '.args.TAILSCALE_VERSION' tailscale/build.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Determine target version
        id: target
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          # Sort the two versions and compare - if latest sorts below current,
          # the current version was pulled upstream and we need to move back.
          HIGHER=$(printf '%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "mode=noop" >> "$GITHUB_OUTPUT"
            echo "Target: no change needed"
          elif [ "$HIGHER" = "$LATEST" ]; then
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "mode=update" >> "$GITHUB_OUTPUT"
            echo "Target: update to $LATEST"
          else
            # LATEST sorted below CURRENT. Only move back if the current version's
            # package is really gone, so a partial or cached listing can't downgrade us.
            URL="https://pkgs.tailscale.com/stable/tailscale_${CURRENT}_amd64.tgz"
            STATUS=$(curl -sIL --retry 3 -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$STATUS" != "404" ]; then
              echo "::error::Listing shows $LATEST below current $CURRENT, but $URL returned HTTP $STATUS (not 404). Refusing to downgrade."
              exit 1
            fi
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "mode=revert" >> "$GITHUB_OUTPUT"
            echo "WARNING: Current version $CURRENT appears to have been pulled - reverting to $LATEST"
          fi

      - name: Apply version change
        if: steps.target.outputs.mode != 'noop'
        env:
          NEW: ${{ steps.target.outputs.version }}
          OLD: ${{ steps.current.outputs.version }}
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          echo "$MODE: $OLD → $NEW"

          OLD_ESC="${OLD//./\\.}"

          # tailscale/Dockerfile
          sed -i \
            "s/ARG TAILSCALE_VERSION=\"${OLD_ESC}\"/ARG TAILSCALE_VERSION=\"${NEW}\"/" \
            tailscale/Dockerfile

          # tailscale/build.json
          sed -i \
            "s/\"TAILSCALE_VERSION\": \"${OLD_ESC}\"/\"TAILSCALE_VERSION\": \"${NEW}\"/" \
            tailscale/build.json

          # tailscale/config.json - set outright with jq so a patch-level
          # add-on version (e.g. x.y.z.1) is replaced too
          jq --arg v "${NEW}.0" '.version = $v' tailscale/config.json \
            > /tmp/config.json.tmp
          mv /tmp/config.json.tmp tailscale/config.json

          # tailscale/CHANGELOG.md
          if [ "$MODE" = "revert" ]; then
            CHANGELOG_ENTRY="- Tailscale updated from \`${OLD}\` to \`${NEW}\` - upstream version \`${OLD}\` was pulled"
          else
            CHANGELOG_ENTRY="- Tailscale package updated to version \`${NEW}\`"
          fi

          awk -v new="$NEW" -v entry="$CHANGELOG_ENTRY" '
            /^# Changelog/ {
              print
              print ""
              print "## " new ".0"
              print ""
              print entry
              print ""
              next
            }
            { print }
          ' tailscale/CHANGELOG.md > /tmp/CHANGELOG.tmp
          mv /tmp/CHANGELOG.tmp tailscale/CHANGELOG.md

      - name: Verify changes
        if: steps.target.outputs.mode != 'noop'
        env:
          NEW: ${{ steps.target.outputs.version }}
        run: |
          fail=0
          grep -qF "ARG TAILSCALE_VERSION=\"${NEW}\"" tailscale/Dockerfile \
            || { echo "::error::Dockerfile not updated"; fail=1; }
          [ "$(jq -r '.args.TAILSCALE_VERSION' tailscale/build.json)" = "$NEW" ] \
            || { echo "::error::build.json not updated"; fail=1; }
          [ "$(jq -r '.version' tailscale/config.json)" = "${NEW}.0" ] \
            || { echo "::error::config.json not updated"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

          echo "=== Dockerfile ===" && grep TAILSCALE_VERSION tailscale/Dockerfile
          echo "=== build.json ===" && cat tailscale/build.json
          echo "=== config.json (version) ===" && grep '"version"' tailscale/config.json
          echo "=== CHANGELOG (head) ===" && head -10 tailscale/CHANGELOG.md

      - name: Commit and push
        if: steps.target.outputs.mode != 'noop'
        env:
          NEW: ${{ steps.target.outputs.version }}
          OLD: ${{ steps.current.outputs.version }}
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tailscale/CHANGELOG.md \
            tailscale/Dockerfile \
            tailscale/build.json \
            tailscale/config.json
          if [ "$MODE" = "revert" ]; then
            git commit -m "chore: update Tailscale version to ${NEW} - upstream version ${OLD} was pulled"
          else
            git commit -m "chore: update Tailscale version to ${NEW}"
          fi

          # Rebase onto anything that landed meanwhile, retry on failure.
          for attempt in 1 2 3 4 5; do
            # Shallow checkout: fetch enough history to rebase onto anything new.
            if git fetch --depth=50 origin "$GITHUB_REF_NAME" && git rebase FETCH_HEAD && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 15))
          done

          echo "::error::Push failed after 5 attempts."
          exit 1

      - name: No update needed
        if: steps.target.outputs.mode == 'noop'
        env:
          CURRENT: ${{ steps.current.outputs.version }}
        run: echo "Already on latest Tailscale version ($CURRENT), nothing to do."
